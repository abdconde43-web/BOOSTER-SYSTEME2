name: YouTube Booster Run

on:
  schedule:
    - cron: '*/10 * * * *' # Se lance toutes les 10 minutes
  workflow_dispatch: # Bouton pour lancer manuellement

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recupere le code
        uses: actions/checkout@v2

      - name: Installe Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Installe les outils Selenium
        run: |
          pip install selenium webdriver-manager


      - name: Execution du Bot en Rafale
        run: |
          # Lance 5 sessions en même temps (Parallel)
          python bot_v1.py & 
          python bot_v1.py & 
          python bot_v1.py & 
          python bot_v1.py & 
          python bot_v1.py & 
          wait
          sleep 5
          # Recommence une deuxième fois
          python bot_v1.py & 
          python bot_v1.py & 
          python bot_v1.py & 
          python bot_v1.py & 
          python bot_v1.py & 
          wait 
